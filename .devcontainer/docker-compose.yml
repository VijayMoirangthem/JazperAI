# Development-only stack for Codespaces / local dev containers. Not for production.
# workspace = the dev container, db = Postgres 16 + pgvector (same image as infra/docker-compose.yml), redis = Redis 7.
# Credentials are throwaway dev defaults for containers that are only reachable on this compose network (and 127.0.0.1);
# override by exporting POSTGRES_PASSWORD / REDIS_PASSWORD (e.g. via Doppler or Codespaces secrets). No real secret belongs here.
name: jazper-dev

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sirjazper
      POSTGRES_DB: coos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jazper-dev-only}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jazper-dev-only}
      JAZPER_ENV: dev
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    # Start order only: do NOT gate on service_healthy. If a service is slow/unhealthy the dev container must still start
    # (otherwise Codespaces drops into recovery mode); scripts/dev/bootstrap.sh waits for the services itself.
    depends_on:
      - db
      - redis
    # No mem_limit here: the container also hosts the VS Code server; the Codespaces machine type is the cap.

  db:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirjazper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jazper-dev-only}
      POSTGRES_DB: coos
    # Small footprint for a 2-core / 8 GB Codespace; no WAL archiving in dev.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "fsync=on"]
    ports:
      - "127.0.0.1:${DEV_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirjazper -d coos"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 192mb --maxmemory-policy allkeys-lru --save ''"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jazper-dev-only}
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m

volumes:
  pgdata:
