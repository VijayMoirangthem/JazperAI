name: secrets-guard
# Secret-scanning + secrets-management tests. Independent of ci.yml (CI repairs live on their own branch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Pinned CLI + sha256 (no third-party action, no licence key). Findings are redacted in logs (--redact).
      - name: Install gitleaks v8.30.0 (checksum verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
  hygiene-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: No tracked .env files, no values in templates, templates in sync
        run: |
          python scripts/secrets/check_repo.py
          python scripts/secrets/gen_env_examples.py --check
      - name: Secrets tests (fake credentials only)
        working-directory: backend/python
        run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings
          pytest -q tests/test_secrets_guard.py -p no:cacheprovider
        env:
          POSTGRES_PASSWORD: fake-ci-not-a-secret
          REDIS_PASSWORD: fake-ci-not-a-secret
