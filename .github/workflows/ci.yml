name: ci
on:
  push:
    branches: [main, "jasper/**"]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend/python } }
    env:
      # Non-secret placeholders allow unit-test imports while real services remain unavailable.
      POSTGRES_PASSWORD: ci-postgres-placeholder
      REDIS_PASSWORD: ci-redis-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/python/requirements.txt }
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx respx ruff
      - run: ruff check . --exit-zero
      - run: pytest -q -m "not db and not integration" --timeout=30 --timeout-method=thread
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  sandbox-integration:
    # Real Docker sandbox on Linux: exercises --user 1000:1000, cap-drop ALL, read-only rootfs and no-new-privileges.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend/python } }
    env:
      POSTGRES_PASSWORD: ci-postgres-placeholder
      REDIS_PASSWORD: ci-redis-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/python/requirements.txt }
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx respx
      - run: docker info --format '{{.ServerVersion}}'
      - run: pytest -q -m integration --timeout=120 --timeout-method=thread
  python-db:
    # Postgres (pgvector) + Redis service containers so the db-marked tests (RLS, tenancy, memory, vault, audit, HITL ...) run in CI.
    # Throwaway containers with placeholder credentials; no real secrets and no external services.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend/python } }
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sirjazper
      POSTGRES_DB: coos
      POSTGRES_PASSWORD: ci-postgres-placeholder
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ci-redis-placeholder
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: sirjazper
          POSTGRES_PASSWORD: ci-postgres-placeholder
          POSTGRES_DB: coos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sirjazper -d coos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start Redis (password-protected, same image as infra/docker-compose.yml)
        working-directory: .
        run: |
          docker run -d --name ci-redis -p 127.0.0.1:6379:6379 redis:7.4-alpine redis-server --requirepass "$REDIS_PASSWORD"
          for i in $(seq 1 20); do
            docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG && exit 0
            sleep 1
          done
          echo "redis did not become ready" >&2; exit 1
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/python/requirements.txt }
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx respx
      - name: Fail loudly if a service is unreachable (the tests skip, not fail, when it is)
        run: |
          python - <<'PY'
          import os, psycopg2, redis
          psycopg2.connect(host=os.environ["POSTGRES_HOST"], port=int(os.environ["POSTGRES_PORT"]), user=os.environ["POSTGRES_USER"],
                           password=os.environ["POSTGRES_PASSWORD"], dbname="postgres").close()
          redis.Redis(host=os.environ["REDIS_HOST"], port=int(os.environ["REDIS_PORT"]), password=os.environ["REDIS_PASSWORD"]).ping()
          print("postgres and redis reachable")
          PY
      - name: Database tests
        run: pytest -q -rs -m "db and not integration" --timeout=120 --timeout-method=thread --junitxml=db-junit.xml
      - name: Summarise database test results (public annotation; logs need auth)
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("db-junit.xml"):
              print("::error title=db tests::no junit report produced"); raise SystemExit(0)
          root = ET.parse("db-junit.xml").getroot()
          cases = list(root.iter("testcase"))
          bad = [(c, c.find("failure") if c.find("failure") is not None else c.find("error")) for c in cases]
          bad = [(c, b) for c, b in bad if b is not None]
          skipped = [c for c in cases if c.find("skipped") is not None]
          passed = len(cases) - len(bad) - len(skipped)
          print(f"db tests: {passed} passed, {len(bad)} failed/errored, {len(skipped)} skipped, {len(cases)} total")
          lines = [f"{passed} passed, {len(bad)} failed, {len(skipped)} skipped of {len(cases)}"]
          for c, b in bad[:25]:
              msg = (b.get("message") or "").splitlines()[:1]
              lines.append(f"FAIL {c.get('classname')}::{c.get('name')} - {(msg[0] if msg else '')[:140]}")
          for c in skipped[:10]:
              s = c.find("skipped")
              lines.append(f"SKIP {c.get('classname')}::{c.get('name')} - {(s.get('message') or '')[:100]}")
          body = "%0A".join(lines)[:3800]
          print(f"::{'error' if bad else 'notice'} title=db test summary::{body}")
          PY
