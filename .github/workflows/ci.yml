name: ci
on:
  push:
    branches: [main, "jasper/**"]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend/python } }
    env:
      # Non-secret placeholders allow unit-test imports while real services remain unavailable.
      POSTGRES_PASSWORD: ci-postgres-placeholder
      REDIS_PASSWORD: ci-redis-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/python/requirements.txt }
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx respx ruff
      - run: ruff check . --exit-zero
      - run: pytest -q -m "not db and not integration" --timeout=30 --timeout-method=thread
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
