name: ci
on:
  push:
    branches: [main, "jasper/**"]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/python/requirements.txt }
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx respx ruff
      - run: ruff check . --exit-zero
      - run: pytest -q -m "not db"
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . || true
      - run: npm run build
