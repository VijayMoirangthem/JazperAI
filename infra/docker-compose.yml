name: jasper
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: jasper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # WAL archiving for PITR (base backups via scripts/backup.ps1; replay documented in docs/ops/backup_restore.md)
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=60", "-c", "archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: jasper-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Object store (S3 API) for unstructured data and backups; WAL segments are shipped here for point-in-time recovery (Plan V3 W7).
  minio:
    image: minio/minio:latest
    container_name: jasper-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ../data/minio:/data   # object data lives in the project folder (D:\Projects\COOS\data\minio)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Copies new WAL segments from the Postgres archive volume into the `wal` bucket every 20 s (read-only mount).
  wal-shipper:
    image: minio/minio:latest  # ships the mc client
    container_name: jasper-wal-shipper
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set m http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb -p m/wal >/dev/null 2>&1
        while true; do mc mirror --overwrite /wal_archive m/wal >/dev/null 2>&1; sleep 20; done
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - wal_archive:/wal_archive:ro

  # Optional: docker compose --profile observability up -d  (stub; filled in P2-10)
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: jasper-prometheus
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres_data:
  wal_archive:
  redis_data:
